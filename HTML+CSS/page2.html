<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Edu+QLD+Hand:wght@400..700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            background-image: url("palepurple.jpg");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;

            font-family: 'Edu QLD Hand', cursive;
            color: #581c87;

            display: flex;
            flex-direction: column;
            align-items: center;

            padding: 40px 20px;
        }

        h1 {
            margin: 10px 0 5px;
            font-size: 38px;
            text-align: center;

            text-shadow:
                1px 1px white,
                -1px -1px white,
                1px -1px white,
                -1px 1px white;
        }

        .subtitle {
            margin: 0 0 30px;
            font-size: 22px;
            text-align: center;
        }

        .options {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;

            width: 100%;
            max-width: 900px;
        }

        .option {
            background: rgba(255, 255, 255, 0.78);

            border: 3px solid #c084fc;
            border-radius: 18px;

            padding: 25px 15px;

            text-align: center;

            cursor: pointer;

            font-family: 'Edu QLD Hand', cursive;
            font-size: 21px;
            color: #581c87;

            box-shadow: 0 6px 0 #9333ea;

            transition: 0.2s;
        }

        .option:hover {
            transform: translateY(-6px);
            background: #f3e8ff;
            box-shadow: 0 10px 0 #7e22ce;
        }

        .option:active {
            transform: translateY(3px);
            box-shadow: 0 3px 0 #7e22ce;
        }

        .fish {
            display: block;

            font-family: serif;
            font-size: 38px;
            line-height: 1.2;

            letter-spacing: 8px;

            margin-bottom: 15px;

            color: #7e22ce;
        }

        .dog {
            border-color: #a855f7;
            background: rgba(237, 233, 254, 0.85);
        }

        .selected {
            background: #c084fc !important;
            color: white !important;
            border-color: #7e22ce !important;
        }

        .selected .fish {
            color: white;
        }

        /* Confirmation box */
        #confirmation {
            display: none;

            margin-top: 35px;

            padding: 20px 30px;

            background: rgba(255, 255, 255, 0.9);

            border: 3px solid #c084fc;
            border-radius: 18px;

            text-align: center;

            box-shadow: 0 6px 0 #9333ea;
        }

        #confirmation p {
            margin: 0 0 15px;

            font-size: 22px;
        }

        .confirm-button {
            border: none;

            padding: 8px 22px;

            margin: 0 7px;

            border-radius: 10px;

            font-family: 'Edu QLD Hand', cursive;
            font-size: 18px;

            cursor: pointer;

            transition: 0.2s;
        }

        #yesConfirm {
            background-color: #c084fc;
            color: #3b0764;

            box-shadow: 0 4px #7e22ce;
        }

        #yesConfirm:hover {
            background-color: #a855f7;
            color: white;

            transform: translateY(-2px);
        }

        #noConfirm {
            background-color: #e9d5ff;
            color: #6b21a8;

            box-shadow: 0 4px #9333ea;
        }

        #noConfirm:hover {
            background-color: #d8b4fe;
        }

        @media (max-width: 700px) {
            .options {
                grid-template-columns: repeat(2, 1fr);
            }

            h1 {
                font-size: 30px;
            }
        }

        @media (max-width: 450px) {
            .options {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <h1>♡ Where should we go? ♡</h1>

    <p class="subtitle">
        pick somewhere for our date! &lt;3
    </p>

    <div class="options">

        <button class="option" data-place="Aquarium 1">
            <span class="fish">𓆝 𓆟 𓆞</span>
            Aquarium 1
        </button>

        <button class="option" data-place="Aquarium 2">
            <span class="fish">𓆟 𓆞 𓆝</span>
            Aquarium 2
        </button>

        <button class="option" data-place="Aquarium 3">
            <span class="fish">𓆞 𓆝 𓆟</span>
            Aquarium 3
        </button>

        <button class="option" data-place="Aquarium 4">
            <span class="fish">𓆝 𓆞 𓆟</span>
            Aquarium 4
        </button>

        <button class="option" data-place="Aquarium 5">
            <span class="fish">𓆟 𓆝 𓆞</span>
            Aquarium 5
        </button>

        <button class="option dog" data-place="Dog Café">
            <span class="fish">♡ ᴥ ♡</span>
            Dog Café
        </button>

    </div>


    <!-- Confirmation -->
    <div id="confirmation">

        <p>
            do you want to pick this one?
        </p>

        <button id="yesConfirm" class="confirm-button">
            yes ♡
        </button>

        <button id="noConfirm" class="confirm-button">
            no
        </button>

    </div>


    <script>

        const options = document.querySelectorAll(".option");

        const confirmation =
            document.getElementById("confirmation");

        const yesConfirm =
            document.getElementById("yesConfirm");

        const noConfirm =
            document.getElementById("noConfirm");

        let selectedPlace = "";


        // Selecting an option
        options.forEach(option => {

            option.addEventListener("click", function() {

                options.forEach(item => {
                    item.classList.remove("selected");
                });

                this.classList.add("selected");

                selectedPlace = this.dataset.place;

                confirmation.style.display = "block";

            });

        });


        // YES - go to page 3
        yesConfirm.addEventListener("click", function() {

            window.location.href =
                "page3.html?place=" +
                encodeURIComponent(selectedPlace);

        });


        // NO - choose again
        noConfirm.addEventListener("click", function() {

            confirmation.style.display = "none";

            options.forEach(item => {
                item.classList.remove("selected");
            });

            selectedPlace = "";

        });

    </script>

</body>
</html>
